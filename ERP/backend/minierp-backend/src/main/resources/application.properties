# =========================================================
# application.properties - Mini ERP Backend
# =========================================================

# --- Conexión a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/minierp
spring.datasource.username=TU_USUARIO
spring.datasource.password=TU_CONTRASEÑA
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# validate: JPA nunca crea/modifica tablas, solo verifica que coincidan
# con el esquema que Flyway ya aplicó. Esto evita que Hibernate y Flyway
# se "peleen" por el control del esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Servidor ---
server.port=8080

# --- Logging (opcional, útil mientras aprendes) ---
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
