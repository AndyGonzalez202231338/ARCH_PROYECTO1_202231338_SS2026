<div class="bg-erp-card border border-erp-border rounded-erp shadow-erp-sm p-5 h-full flex flex-col">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="text-sm font-semibold text-erp-primary">{{ title }}</h3>
      <p class="text-xs text-erp-primary/50 mt-0.5">{{ description }}</p>
    </div>

    <div *ngIf="periods.length" class="flex items-center bg-erp-bg border border-erp-border rounded-lg p-0.5 text-xs shrink-0">
      <button *ngFor="let p of periods" type="button" (click)="activePeriod = p"
              class="px-2.5 py-1 rounded-md transition-colors"
              [ngClass]="activePeriod === p ? 'bg-erp-secondary text-white' : 'text-erp-primary/60 hover:text-erp-primary'">
        {{ p }}
      </button>
    </div>
  </div>

  <div *ngIf="type === 'bar'" class="mt-6 flex-1 flex items-end justify-between gap-2 min-h-[160px]">
    <div *ngFor="let point of series[0]?.points" class="flex-1 flex flex-col items-center gap-2">
      <div class="w-full flex items-end justify-center gap-1 h-32">
        <div *ngFor="let s of series" class="w-2.5 rounded-t-sm transition-all"
             [ngClass]="s.colorClass" [style.height.%]="pointFor(s, point.label)"></div>
      </div>
      <span class="text-[11px] text-erp-primary/50">{{ point.label }}</span>
    </div>
  </div>

  <div *ngIf="type === 'line'" class="mt-6 flex-1 min-h-[160px]">
    <svg viewBox="0 0 300 120" preserveAspectRatio="none" class="w-full h-32">
      <line x1="0" y1="30" x2="300" y2="30" class="stroke-erp-border" stroke-width="1" />
      <line x1="0" y1="60" x2="300" y2="60" class="stroke-erp-border" stroke-width="1" />
      <line x1="0" y1="90" x2="300" y2="90" class="stroke-erp-border" stroke-width="1" />
      <polyline *ngFor="let s of series" [attr.points]="toPolyline(s)" fill="none"
                [ngClass]="s.colorClass" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="flex justify-between mt-1">
      <span *ngFor="let point of series[0]?.points" class="text-[11px] text-erp-primary/50">{{ point.label }}</span>
    </div>
  </div>

  <div *ngIf="series.length > 1" class="mt-4 flex items-center gap-4 border-t border-erp-border pt-3">
    <div *ngFor="let s of series" class="flex items-center gap-1.5 text-xs text-erp-primary/60">
      <span class="w-2.5 h-2.5 rounded-full" [ngClass]="legendDot(s.colorClass)"></span>
      {{ s.name }}
    </div>
  </div>
</div>
