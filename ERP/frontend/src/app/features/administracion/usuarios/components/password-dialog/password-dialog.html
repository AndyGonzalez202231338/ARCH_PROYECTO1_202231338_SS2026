<div *ngIf="usuario as u" class="pw-overlay" (click)="onCerrar()">
  <div class="pw-card" (click)="$event.stopPropagation()">
    <h3 class="pw-card__title">Cambiar contraseña</h3>
    <p class="pw-card__subtitle">Usuario: {{ u.nombre }}</p>

    <form [formGroup]="form" class="pw-card__form" (ngSubmit)="onGuardar()">
      <div class="field">
        <label class="field__label">Nueva contraseña <span class="field__required">*</span></label>
        <input
          type="password"
          class="field__input"
          formControlName="nuevaPassword"
          placeholder="Mínimo 6 caracteres" />
        <p *ngIf="campoInvalido('nuevaPassword')" class="field__error">
          La contraseña debe tener al menos 6 caracteres.
        </p>
      </div>

      <div class="field">
        <label class="field__label">Confirmar contraseña <span class="field__required">*</span></label>
        <input
          type="password"
          class="field__input"
          formControlName="confirmarPassword"
          placeholder="Repite la contraseña" />
        <p *ngIf="campoInvalido('confirmarPassword')" class="field__error">
          La confirmación debe tener al menos 6 caracteres.
        </p>
        <p *ngIf="noCoinciden()" class="field__error">
          Las contraseñas no coinciden.
        </p>
      </div>

      <div class="pw-card__actions">
        <button type="button" class="btn btn--secondary" (click)="onCerrar()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="invalido || guardando">
          {{ guardando ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
