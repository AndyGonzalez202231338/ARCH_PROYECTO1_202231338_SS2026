<app-dashboard-header eyebrow="Panel principal / Ventas"></app-dashboard-header>

<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
  <app-stats-card title="Ventas del período" value="Q 125,000.00" icon="chart-bar" trend="up" trendValue="12%" subtitle="vs. período anterior"></app-stats-card>
  <app-stats-card title="Número de ventas" value="96" icon="shopping-cart" trend="up" trendValue="5%"></app-stats-card>
  <app-stats-card title="Clientes atendidos" value="74" icon="users"></app-stats-card>
  <app-stats-card title="Ticket promedio" value="Q 1,302.00" icon="clipboard-document-list"></app-stats-card>
</div>

<div class="grid grid-cols-1 mt-4">
  <app-chart-card title="Ventas por período" description="Evolución de ventas totales" type="line"
                   [series]="ventasSeries" [periods]="['Hoy', 'Semana', 'Mes', 'Año']"></app-chart-card>
</div>

<div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mt-4">
  <app-data-table title="Últimas ventas" [columns]="ventasColumns" [rows]="ventasRows"></app-data-table>

  <div class="bg-erp-card border border-erp-border rounded-erp shadow-erp-sm p-5">
    <h3 class="text-sm font-semibold text-erp-primary mb-4">Top productos más vendidos</h3>
    <div class="space-y-3">
      <div *ngFor="let p of topProductos; let i = index" class="flex items-center justify-between text-sm">
        <div class="flex items-center gap-3">
          <span class="w-6 h-6 rounded-full bg-erp-bg border border-erp-border flex items-center justify-center text-xs font-medium text-erp-primary/60">{{ i + 1 }}</span>
          <span class="text-erp-primary/80">{{ p.nombre }}</span>
        </div>
        <span class="font-medium text-erp-primary">{{ p.cantidad }}</span>
      </div>
    </div>
  </div>
</div>

<div class="grid grid-cols-1 mt-4">
  <app-data-table title="Top clientes" [columns]="clientesColumns" [rows]="clientesRows"></app-data-table>
</div>
