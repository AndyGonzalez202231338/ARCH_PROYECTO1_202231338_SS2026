<app-toast></app-toast>

<div class="flex flex-col gap-6 font-sans">

  <!-- Header del Formulario -->
  <div class="flex flex-col">
    <nav class="text-[13px] text-erp-primary/60 font-medium mb-3 flex items-center gap-2">
      <span>Inicio</span>
      <span>/</span>
      <a routerLink="/proveedores" class="hover:text-erp-secondary transition-colors cursor-pointer">Proveedores</a>
      <span>/</span>
      <span class="text-erp-primary font-bold">{{ breadcrumbActual() }}</span>
    </nav>

    <button type="button" class="self-start text-[13px] font-bold text-erp-secondary hover:text-erp-primary hover:underline transition-all flex items-center gap-1 mb-2" (click)="cancelar()">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Volver
    </button>

    <h1 class="text-2xl md:text-3xl font-extrabold text-erp-primary tracking-tight">
      {{ titulo() }}
    </h1>
  </div>

  <!-- Formulario -->
  <div class="bg-erp-card border border-erp-border rounded-xl shadow-sm max-w-xl w-full mx-auto p-6 md:p-8" *ngIf="!cargandoDatos()">

    <h2 class="text-lg font-extrabold text-erp-primary mb-6 border-b border-erp-border/50 pb-4">
      Información del Proveedor
    </h2>

    <form [formGroup]="form" class="flex flex-col gap-5" (ngSubmit)="guardar()">

      <!-- Nombre / Razón social -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-bold text-erp-primary">
          Nombre / Razón social <span class="text-erp-critical">*</span>
        </label>
        <input type="text" formControlName="nombre" maxlength="150" placeholder="Ej. Distribuidora Central, S.A."
               class="w-full bg-erp-bg/50 border border-erp-border rounded-lg px-4 py-2.5 text-sm text-erp-primary focus:outline-none focus:border-erp-secondary focus:bg-erp-card focus:ring-2 focus:ring-erp-secondary/20 transition-all placeholder:text-erp-primary/30" />
        <p *ngIf="campoInvalido('nombre')" class="text-xs font-semibold text-erp-critical mt-0.5">
          El nombre es requerido (máximo 150 caracteres).
        </p>
      </div>

      <!-- NIT -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-bold text-erp-primary">
          NIT <span class="text-erp-critical">*</span>
        </label>
        <input type="text" formControlName="nit" maxlength="30" placeholder="Ej. 1234567-8"
               class="w-full bg-erp-bg/50 border border-erp-border rounded-lg px-4 py-2.5 text-sm text-erp-primary focus:outline-none focus:border-erp-secondary focus:bg-erp-card focus:ring-2 focus:ring-erp-secondary/20 transition-all placeholder:text-erp-primary/30" />
        <p *ngIf="campoInvalido('nit')" class="text-xs font-semibold text-erp-critical mt-0.5">
          El NIT es requerido (máximo 30 caracteres).
        </p>
      </div>

      <!-- Teléfono + Email -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-bold text-erp-primary">Teléfono</label>
          <input type="text" formControlName="telefono" maxlength="30" placeholder="Ej. 2345-6789"
                 class="w-full bg-erp-bg/50 border border-erp-border rounded-lg px-4 py-2.5 text-sm text-erp-primary focus:outline-none focus:border-erp-secondary focus:bg-erp-card focus:ring-2 focus:ring-erp-secondary/20 transition-all placeholder:text-erp-primary/30" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-bold text-erp-primary">Email</label>
          <input type="email" formControlName="email" placeholder="contacto@proveedor.com"
                 class="w-full bg-erp-bg/50 border border-erp-border rounded-lg px-4 py-2.5 text-sm text-erp-primary focus:outline-none focus:border-erp-secondary focus:bg-erp-card focus:ring-2 focus:ring-erp-secondary/20 transition-all placeholder:text-erp-primary/30" />
          <p *ngIf="campoInvalido('email')" class="text-xs font-semibold text-erp-critical mt-0.5">
            Ingresa un correo electrónico válido.
          </p>
        </div>
      </div>

      <!-- Dirección -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-bold text-erp-primary">Dirección</label>
        <textarea formControlName="direccion" rows="2" maxlength="255" placeholder="Dirección del proveedor"
                  class="w-full bg-erp-bg/50 border border-erp-border rounded-lg px-4 py-2.5 text-sm text-erp-primary focus:outline-none focus:border-erp-secondary focus:bg-erp-card focus:ring-2 focus:ring-erp-secondary/20 transition-all placeholder:text-erp-primary/30 resize-none"></textarea>
      </div>

      <!-- Switch Activo/Inactivo -->
      <div class="flex items-center gap-3 mt-2">
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" formControlName="activo" class="sr-only peer" />
          <div class="w-11 h-6 bg-erp-border/80 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-erp-secondary focus:ring-2 focus:ring-erp-secondary/30"></div>
        </label>
        <span class="text-[14px] font-bold text-erp-primary">Proveedor activo</span>
      </div>

      <!-- Botones de Acción -->
      <div class="flex flex-col sm:flex-row items-center justify-end gap-3 mt-6 pt-6 border-t border-erp-border/50">
        <button type="button" class="w-full sm:w-auto px-6 py-2.5 bg-erp-card border border-erp-border text-erp-primary font-bold rounded-lg hover:bg-erp-bg transition-colors" (click)="cancelar()">
          Cancelar
        </button>
        <button type="submit"
                class="w-full sm:w-auto px-6 py-2.5 bg-erp-secondary text-erp-card font-bold rounded-lg hover:bg-erp-primary disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-sm focus:outline-none focus:ring-4 focus:ring-erp-secondary/30"
                [disabled]="form.invalid || guardando()">
          {{ guardando() ? 'Guardando cambios...' : textoBoton() }}
        </button>
      </div>
    </form>
  </div>

  <!-- Skeleton Loading (Cargando datos) -->
  <div class="bg-erp-card border border-erp-border rounded-xl shadow-sm max-w-xl w-full mx-auto p-6 md:p-8 animate-pulse" *ngIf="cargandoDatos()">
    <div class="h-6 bg-erp-border/60 rounded w-1/3 mb-8"></div>
    <div class="flex flex-col gap-6">
      <div class="h-12 bg-erp-border/40 rounded-lg w-full"></div>
      <div class="h-12 bg-erp-border/40 rounded-lg w-full"></div>
      <div class="h-12 bg-erp-border/40 rounded-lg w-full"></div>
      <div class="h-16 bg-erp-border/40 rounded-lg w-full"></div>
      <div class="flex justify-end gap-3 mt-4">
        <div class="h-10 bg-erp-border/50 rounded-lg w-24"></div>
        <div class="h-10 bg-erp-border/60 rounded-lg w-32"></div>
      </div>
    </div>
  </div>
</div>
